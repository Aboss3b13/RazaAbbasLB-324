name: Anforderung
description: Neue Funktionalität als Anforderung erfassen
title: "[Anforderung]: "
body:
  - type: markdown
    attributes:
      value: |
        Aufbau: **Zielsystem + Priorität + Systemaktivität + allf. Ergänzungen + Funktionalität + Bedingungen**

        Beispiel: *Reflect Media Player muss dem Benutzer die Möglichkeit bieten, J3D Szenengraphen aus einer wrml-Datei über das Netzwerk zu laden, falls der Benutzer eingeschrieben ist.*

        Bitte die Issue danach manuell mit dem Typ etikettieren (Funktionale Anforderung, Qualitätsanforderung, Randanforderung).
  - type: input
    id: zielsystem
    attributes:
      label: Zielsystem
      description: Das betroffene (Teil-)System
      placeholder: z.B. Tagebbbuch
    validations:
      required: true
  - type: dropdown
    id: prioritaet
    attributes:
      label: Priorität
      options:
        - muss (hoch)
        - soll (mittel)
        - wird (niedrig)
    validations:
      required: true
  - type: dropdown
    id: systemaktivitaet
    attributes:
      label: Systemaktivität
      options:
        - selbständig (System handelt selbst)
        - dem Benutzer die Möglichkeit bieten (Benutzerfunktion)
        - fähig sein (Schnittstelle)
    validations:
      required: true
  - type: input
    id: ergaenzungen
    attributes:
      label: Ergänzungen (optional)
      placeholder: z.B. mit einem Emoji
  - type: input
    id: funktionalitaet
    attributes:
      label: Funktionalität
      placeholder: z.B. einen Eintrag zu erfassen
    validations:
      required: true
  - type: input
    id: bedingungen
    attributes:
      label: Bedingungen (optional)
      description: Zeitliche Bedingungen mit "wenn", logische Bedingungen mit "falls"
      placeholder: z.B. falls der Benutzer eingeschrieben ist
  - type: textarea
    id: anforderung
    attributes:
      label: Anforderung als ganzer Satz
      placeholder: Tagebbbuch muss dem Benutzer die Möglichkeit bieten, ...
    validations:
      required: true
