<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Diary App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
    <h1>My Diary</h1>

    {% if session.logged_in %}
    <h2>Welcome, you are logged in!</h2>
    <a href="/logout">Logout</a>
    <form method="POST" action="/add_entry">
        <textarea name="content" rows="4" placeholder="Write your entry here..."></textarea>
        <br>
        <select name="happiness">
            <option value="😃">😃</option>
            <option value="🙂">🙂</option>
            <option value="😐">😐</option>
            <option value="🙁">🙁</option>
            <option value="😢">😢</option>
        </select>
        <button type="submit">Add Entry</button>
    </form>
    <h2>Entries:</h2>
    <ul class="entries">
        {% for entry in entries %}
        <li><span class="time">{{ entry.timestamp.strftime('%Y-%m-%d %H:%M') }}</span><br>{{ entry.happiness }} {{ entry.content }}</li>
        {% endfor %}
    </ul>

    {% else %}
    <h2>Please log in to view your diary:</h2>
    <a href="/login">Login</a>
    {% endif %}


    </div>
</body>

</html>
